<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Codextent</title>
  <link rel="stylesheet" href="../ui/pages.css">
  <script src="../ui/theme.js"></script>
  <style>
    body { width: 330px; min-height: 0; }
    .top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .top img { width: 26px; height: 26px; }
    .top .name { font-weight: 600; font-size: 15px; letter-spacing: -.02em; }
    .top .acc { margin-left: auto; text-align: right; }
    .top .acc b { font-size: 22px; display: block; line-height: 1; letter-spacing: -.03em; }
    .top .acc span { font-size: 11px; color: var(--muted); }
    .body { padding: 12px 14px 14px; }
    .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .mini div { text-align: center; background: var(--card); background-image: var(--card-grad); border: 1px solid var(--line); border-radius: 12px; padding: 8px 0; transition: box-shadow .2s; }
    .mini div:hover { box-shadow: var(--glow); }
    .mini b { display: block; font-size: 17px; letter-spacing: -.02em; }
    .mini span { font-size: 11px; color: var(--muted); }
    .langs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .langs span { font-size: 11.5px; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 9px; color: var(--muted); }
    .langs b { color: var(--text); font-weight: 600; }
    .recent { list-style: none; margin: 0; padding: 0; }
    .recent li { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .recent li:first-child { border-top: 0; }
    .recent .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent .w { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .clipbox { display: flex; gap: 8px; }
    .clipbox .btn { flex: 1; white-space: nowrap; gap: 6px; }
    .clipbox .btn.icon-only { flex: none; width: 40px; padding: 0; }
    .clipbox .btn.icon-only[aria-expanded="true"] { border-color: var(--strong); }
    .notepanel { display: grid; gap: 8px; margin: 10px 0 0; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); background-image: var(--card-grad); }
    .notepanel.hidden { display: none; }
    .nfor { margin: 0; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notepanel textarea { width: 100%; resize: vertical; min-height: 72px; font: 13px/1.5 inherit; font-family: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); color: var(--text, var(--ink)); }
    .notepanel textarea:focus { outline: none; box-shadow: 0 0 0 1px var(--strong); }
    .nrow { display: flex; gap: 8px; } .nrow .btn { flex: 1; }
    .clipbox svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round; }
    .cliphint { margin: 8px 0 10px; font-size: 11.5px; color: var(--muted); }
    .cliphint:empty { display: none; }
    .clipbox { margin-bottom: 10px; }
    .cliphint.ok { color: var(--text, var(--ink)); font-weight: 600; }
    .lcrow { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 12px;
             background: var(--card); background-image: var(--card-grad); color: var(--text, var(--ink)); font: inherit; font-size: 13px; cursor: pointer; text-align: left; transition: box-shadow .2s; }
    .lcrow:hover { box-shadow: var(--glow); }
    .lcrow .lcdot { width: 8px; height: 8px; border-radius: 50%; background: #ffa116; }
    .lcrow #lcCount { color: var(--muted); } .lcrow .go { margin-left: auto; color: var(--muted); font-size: 16px; }
    .spoil { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); background-image: var(--card-grad); cursor: pointer; margin-bottom: 10px; transition: box-shadow .2s; }
    .spoil:hover { box-shadow: var(--glow); }
    .spoil span { flex: 1; display: grid; } .spoil b { font-size: 13px; } .spoil small { font-size: 11px; color: var(--muted); }
    .spoil input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .spoil i { flex: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line-2, rgba(255,255,255,.2)); position: relative; transition: background .2s; }
    .spoil i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
    .spoil input:checked + i { background: var(--strong); }
    .spoil input:checked + i::after { transform: translateX(14px); background: var(--on-strong); }
    .spoil input:focus-visible + i { outline: 2px solid var(--strong); outline-offset: 2px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions .btn { flex: 1; white-space: nowrap; }
    .actions #openOptions { flex: none; width: 40px; padding: 8px 0; }
  </style>
</head>
<body>
  <div class="top">
    <img class="logo-dark-bg" src="../../icons/icon-white48.png" alt=""><img class="logo-light-bg" src="../../icons/icon48.png" alt="">
    <span class="name">Codextent</span>
    <div class="acc"><b id="accuracy">–</b><span>accuracy</span></div>
  </div>
  <div class="body">
    <div class="clipbox">
      <button class="btn primary" id="clipBtn" type="button" title="Save the code you selected on this page (or right-click it → Save to My Revision Vault, or press Alt+Shift+S)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1z"/></svg>Clip selection
      </button>
      <button class="btn icon-only" id="noteBtn" type="button" title="Write a note for this page's topic" aria-label="Write a note for this page" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10l4 4V19.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-14a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>
      </button>
      <button class="btn" id="openVault" type="button">Revision Vault</button>
    </div>
    <div class="notepanel hidden" id="notePanel">
      <p class="nfor" id="noteFor">Note for this page</p>
      <textarea id="noteText" rows="4" placeholder="Your note… (Ctrl+Enter saves)" aria-label="Note for this page"></textarea>
      <div class="nrow"><button class="btn primary" id="noteSave" type="button">Save note</button><button class="btn" id="noteCancel" type="button">Cancel</button></div>
    </div>
    <p class="cliphint" id="clipMsg" role="status"></p>
    <div class="mini">
      <div><b id="correct">0</b><span>&#10003; correct</span></div>
      <div><b id="wrong">0</b><span>&#10007; wrong</span></div>
      <div><b id="streak">0</b><span>streak</span></div>
    </div>
    <button class="lcrow" id="lcRow" type="button" title="Problems you marked on LeetCode to solve later">
      <span class="lcdot" aria-hidden="true"></span><b>LeetCode</b><span id="lcCount">0 to solve</span><span class="go" aria-hidden="true">›</span>
    </button>
    <label class="spoil" title="Hides each site's own answers (Output boxes, // Outputs comments, View Answer) until you check. Click a blurred box to peek.">
      <span><b>Blur outputs</b><small>Hide the site's answers until you check</small></span>
      <input type="checkbox" id="spoiler" role="switch"><i aria-hidden="true"></i>
    </label>
    <div class="actions">
      <button class="btn" id="openDashboard" type="button">My Learning Hub</button>
      <button class="btn" id="openOptions" type="button" title="Settings" aria-label="Settings">&#9881;</button>
    </div>
  </div>
  <script src="../lib/stats.js"></script>
  <script src="../lib/leetcode.js"></script>
  <script src="../ui/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
